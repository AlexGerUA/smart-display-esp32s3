<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Smart Display wiring</title>
<style>
  html, body { margin: 0; background: #fff; }
  svg { display: block; }
  .lbl { font: 700 13px Arial, Helvetica, sans-serif; fill: #fff; }
  .pad { font: 700 17px Arial, Helvetica, sans-serif; fill: #f2f2f2; }
  .leg { font: 900 38px 'Arial Black', Arial, Helvetica, sans-serif; }
  .small { font: 700 20px Arial, Helvetica, sans-serif; fill: #333; }
  .wire { fill: none; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
</style></head>
<body>
<!-- Smart Display wiring: ST7789 240x280 + ESP32-S3 Super Mini + TTP223 + Li-ion via switch.
     Pins match platformio.ini / Config.h. Render: docs/wiring.png -->
<svg width="1700" height="1080" viewBox="0 0 1700 1080" xmlns="http://www.w3.org/2000/svg">

  <!-- ===== display module ===== -->
  <rect x="120" y="150" width="330" height="480" rx="18" fill="#1d5fbf"/>
  <circle cx="140" cy="232" r="12" fill="#fff"/><circle cx="430" cy="232" r="12" fill="#fff"/>
  <circle cx="152" cy="598" r="16" fill="#fff"/><circle cx="418" cy="598" r="16" fill="#fff"/>
  <defs>
    <linearGradient id="scr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3aa0e8"/><stop offset=".55" stop-color="#8fd3ff"/><stop offset="1" stop-color="#1f7fd0"/>
    </linearGradient>
  </defs>
  <rect x="150" y="235" width="270" height="330" rx="26" fill="#0a0a0a"/>
  <rect x="160" y="245" width="250" height="290" rx="20" fill="url(#scr)"/>
  <rect x="215" y="565" width="140" height="30" rx="3" fill="#d49a2a"/>
  <!-- header pins -->
  <g>
    <circle cx="166" cy="178" r="9" fill="#ddd" stroke="#555" stroke-width="3"/>
    <circle cx="200" cy="178" r="9" fill="#ddd" stroke="#555" stroke-width="3"/>
    <circle cx="234" cy="178" r="9" fill="#ddd" stroke="#555" stroke-width="3"/>
    <circle cx="268" cy="178" r="9" fill="#ddd" stroke="#555" stroke-width="3"/>
    <circle cx="302" cy="178" r="9" fill="#ddd" stroke="#555" stroke-width="3"/>
    <circle cx="336" cy="178" r="9" fill="#ddd" stroke="#555" stroke-width="3"/>
    <circle cx="370" cy="178" r="9" fill="#ddd" stroke="#555" stroke-width="3"/>
  </g>
  <circle cx="404" cy="178" r="9" fill="#ddd" stroke="#555" stroke-width="3"/>
  <g class="lbl" text-anchor="middle">
    <text x="166" y="214">GND</text><text x="200" y="214">VCC</text><text x="234" y="214">SCL</text>
    <text x="268" y="214">SDA</text><text x="302" y="214">RES</text><text x="336" y="214">DC</text>
    <text x="370" y="214">CS</text><text x="404" y="214">BLK</text>
  </g>

  <!-- ===== ESP32-S3 Super Mini (top view) ===== -->
  <rect x="1090" y="300" width="310" height="445" rx="10" fill="#141414"/>
  <rect x="1190" y="270" width="110" height="80" rx="8" fill="#9a9a9a"/>
  <text x="1245" y="316" text-anchor="middle" class="pad" style="fill:#333">USB-C</text>
  <rect x="1195" y="470" width="100" height="100" fill="#3a3a3a" transform="rotate(45 1245 520)"/>
  <text x="1245" y="700" text-anchor="middle" class="pad">ESP32-S3 Super Mini</text>
  <!-- left pads -->
  <g fill="#d6a83a" stroke="#8a6a1c" stroke-width="2">
    <circle cx="1110" cy="350" r="11"/><circle cx="1110" cy="390" r="11"/><circle cx="1110" cy="430" r="11"/>
    <circle cx="1110" cy="470" r="11"/><circle cx="1110" cy="510" r="11"/><circle cx="1110" cy="550" r="11"/>
    <circle cx="1110" cy="590" r="11"/><circle cx="1110" cy="630" r="11"/><circle cx="1110" cy="670" r="11"/>
  </g>
  <g class="pad">
    <text x="1130" y="356">TX</text><text x="1130" y="396">RX</text><text x="1130" y="436">1</text>
    <text x="1130" y="476">2</text><text x="1130" y="516">3</text><text x="1130" y="556">4</text>
    <text x="1130" y="596">5</text><text x="1130" y="636">6</text><text x="1130" y="676">7</text>
  </g>
  <!-- right pads -->
  <g fill="#d6a83a" stroke="#8a6a1c" stroke-width="2">
    <circle cx="1380" cy="350" r="11"/><circle cx="1380" cy="390" r="11"/><circle cx="1380" cy="430" r="11"/>
    <circle cx="1380" cy="470" r="11"/><circle cx="1380" cy="510" r="11"/><circle cx="1380" cy="550" r="11"/>
    <circle cx="1380" cy="590" r="11"/><circle cx="1380" cy="630" r="11"/><circle cx="1380" cy="670" r="11"/>
    <circle cx="1380" cy="710" r="11"/>
  </g>
  <g class="pad" text-anchor="end">
    <text x="1360" y="356">BAT</text><text x="1360" y="396">5V</text><text x="1360" y="436">GND</text>
    <text x="1360" y="476">3V3</text><text x="1360" y="516">13</text><text x="1360" y="556">12</text>
    <text x="1360" y="596">11</text><text x="1360" y="636">10</text><text x="1360" y="676">9</text>
    <text x="1360" y="716">8</text>
  </g>

  <!-- ===== display wires: pin -> lane -> right side -> pad ===== -->
  <path class="wire" stroke="#1b1b1b" d="M166 170 V40 H1590 V430 H1391"/>
  <path class="wire" stroke="#e02424" d="M200 170 V55 H1570 V470 H1391"/>
  <path class="wire" stroke="#1a9be0" d="M234 170 V70 H1550 V630 H1391"/>
  <path class="wire" stroke="#f08a3c" d="M268 170 V85 H1530 V590 H1391"/>
  <path class="wire" stroke="#3aa05a" d="M302 170 V100 H1510 V710 H1391"/>
  <path class="wire" stroke="#e6b800" d="M336 170 V115 H1490 V550 H1391"/>
  <path class="wire" stroke="#3b2d8f" d="M370 170 V130 H1470 V510 H1391"/>
  <path class="wire" stroke="#e0197d" d="M404 170 V145 H1450 V670 H1391"/>

  <!-- ===== TTP223 touch module ===== -->
  <rect x="960" y="785" width="130" height="80" rx="8" fill="#c9303a"/>
  <circle cx="1025" cy="838" r="18" fill="#e9e9e9"/>
  <text x="1025" y="892" text-anchor="middle" class="small">TTP223</text>
  <g fill="#ddd" stroke="#555" stroke-width="3">
    <circle cx="985" cy="785" r="7"/><circle cx="1025" cy="785" r="7"/><circle cx="1065" cy="785" r="7"/>
  </g>
  <g class="small" text-anchor="middle" style="font-size:14px">
    <text x="985" y="812" style="fill:#fff">OUT</text><text x="1025" y="812" style="fill:#fff">VCC</text><text x="1065" y="812" style="fill:#fff">GND</text>
  </g>
  <path class="wire" stroke="#00a39a" d="M985 778 V630 H1099"/>
  <path class="wire" stroke="#e02424" d="M1025 778 V760 H1570 V470"/>
  <path class="wire" stroke="#1b1b1b" d="M1065 778 V770 H1420 V1045"/>

  <!-- ===== battery + switch ===== -->
  <rect x="120" y="860" width="210" height="140" rx="6" fill="#8d8d8d" stroke="#333" stroke-width="4"/>
  <rect x="150" y="842" width="50" height="22" fill="#e02424"/>
  <text x="225" y="955" text-anchor="middle" style="font:700 44px Arial;fill:#333">Li-ion</text>
  <text x="225" y="990" text-anchor="middle" class="small">3.7 V</text>
  <rect x="330" y="905" width="22" height="50" fill="#1b1b1b"/>
  <text x="175" y="905" text-anchor="middle" style="font:700 30px Arial;fill:#333">+</text>
  <!-- slide switch -->
  <rect x="140" y="720" width="90" height="40" rx="4" fill="#f4f4f4" stroke="#444" stroke-width="3"/>
  <rect x="165" y="690" width="22" height="34" fill="#f4f4f4" stroke="#444" stroke-width="3"/>
  <line x1="160" y1="760" x2="160" y2="790" stroke="#444" stroke-width="4"/>
  <line x1="185" y1="760" x2="185" y2="790" stroke="#444" stroke-width="4"/>
  <line x1="210" y1="760" x2="210" y2="790" stroke="#444" stroke-width="4"/>
  <text x="248" y="748" class="small">switch</text>
  <!-- battery + -> switch -> BAT pad (drawn with a white halo where it crosses) -->
  <path class="wire" stroke="#e02424" d="M175 842 V790"/>
  <path class="wire" stroke="#fff" stroke-width="11" d="M1640 350 H1392"/>
  <path class="wire" stroke="#e02424" d="M210 790 V810 H60 V15 H1640 V350 H1391"/>
  <!-- battery - -> GND -->
  <path class="wire" stroke="#1b1b1b" d="M352 930 H380 V1045 H1590 V430"/>

  <!-- junctions -->
  <g fill="#1b1b1b"><circle cx="1420" cy="1045" r="8"/><circle cx="1590" cy="430" r="8"/></g>
  <circle cx="1570" cy="470" r="8" fill="#e02424"/>

  <!-- ===== legend ===== -->
  <g class="leg">
    <text x="480" y="700" fill="#f08a3c">SDA (MOSI) - GPIO11</text>
    <text x="480" y="746" fill="#1a9be0">SCL - GPIO10</text>
    <text x="480" y="792" fill="#3b2d8f">CS - GPIO13</text>
    <text x="480" y="838" fill="#d4a800">DC - GPIO12</text>
    <text x="480" y="884" fill="#3aa05a">RES - GPIO8</text>
    <text x="480" y="930" fill="#e0197d">BLK - GPIO9</text>
    <text x="480" y="976" fill="#00a39a">TOUCH - GPIO6</text>
  </g>
  <text x="480" y="1012" class="small">VCC → 3V3 · GND → GND</text><text x="480" y="1036" class="small">Battery + → switch → BAT pad (never to 3V3)</text>
</svg>
</body></html>
