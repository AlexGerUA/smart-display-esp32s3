; Smart Display — ESP32-S3 Super Mini (4 MB flash, quad) + ST7789 240x280.
; Wiring: docs/pinout.html.

[platformio]
default_envs = supermini

[env:supermini]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino

; Conservative: 4 MB + quad PSRAM boots on both FH4R2 and N16R8 chips.
; The reverse does NOT work — a 16 MB image on a 4 MB chip bootloops before
; Serial even starts. Boards without PSRAM boot too (buffers go to internal RAM).
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi
; Two 1.9 MB app slots for web OTA (/update).
board_build.partitions = min_spiffs.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.2.1
    bitbank2/PNGdec@^1.0.3

build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DBOARD_HAS_PSRAM
  ; Native USB-C — both flashing and Serial
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; ---- TFT_eSPI is configured here; the library's User_Setup.h is untouched ----
  -DUSER_SETUP_LOADED=1
  -DST7789_DRIVER=1
  -DTFT_WIDTH=240
  ; The controller has 240x320 RAM; TFT_eSPI applies the 20-row offset itself
  ; when TFT_HEIGHT=280.
  -DTFT_HEIGHT=280
  -DTFT_RGB_ORDER=TFT_BGR
  -DTFT_INVERSION_ON=1
  -DUSE_HSPI_PORT=1
  -DSPI_FREQUENCY=40000000
  ; Pins — right-hand pad row of the Super Mini, top to bottom 13/12/11/10/9/8
  -DTFT_CS=13
  -DTFT_DC=12
  -DTFT_MOSI=11
  -DTFT_SCLK=10
  -DTFT_BL=9
  -DTFT_BACKLIGHT_ON=HIGH
  -DTFT_RST=8
  ; The display is never read, SDO is not connected
  -DTFT_MISO=-1
  ; Fonts. With USER_SETUP_LOADED the library loads none by itself —
  ; without these flags drawString silently draws nothing.
  ; GLCD — fallback, FONT2 — ping screen, SMOOTH_FONT — anti-aliased fonts.
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DSMOOTH_FONT=1
